<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>Visitas São José</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra">
  <div class="titulo"><img class="logo" src="logo-barra.png" width="290" height="64" alt="Pastos"><span><b>São José</b> · <span id="sub">Visitas de campo</span></span></div>
  <div class="acciones">
    <button id="btn-sync" class="pill" type="button">—</button>
    <button class="pill icono" type="button" data-tela="config" aria-label="Ajustes">⚙️</button>
  </div>
</header>

<main>
  <section id="tela-mapa" class="tela">
    <div id="mapa"></div>
    <div id="aqui" class="aqui oculto"></div>
    <div class="leyenda" id="leyenda"></div>
  </section>
  <section id="tela-potreiros" class="tela oculto"></section>
  <section id="tela-ficha" class="tela oculto"></section>
  <section id="tela-nuevo" class="tela oculto"></section>
  <section id="tela-visita" class="tela oculto"></section>
  <section id="tela-gasto" class="tela oculto"></section>
  <section id="tela-visitas" class="tela oculto"></section>
  <section id="tela-gastos" class="tela oculto"></section>
  <section id="tela-costos" class="tela oculto"></section>
  <section id="tela-detalle" class="tela oculto"></section>
  <section id="tela-detalleGasto" class="tela oculto"></section>
  <section id="tela-asistente" class="tela oculto"></section>
  <section id="tela-config" class="tela oculto"></section>
</main>

<nav class="pestanas">
  <button data-tela="mapa" class="activa" type="button"><span>🗺️</span><b data-t="mapa"></b></button>
  <button data-tela="potreiros" type="button"><span>📋</span><b data-t="potreiros"></b></button>
  <button data-tela="nueva" type="button" class="nueva"><span>＋</span><b>&nbsp;</b></button>
  <button data-tela="visitas" type="button"><span>🗂️</span><b data-t="registros"></b></button>
  <button data-tela="asistente" type="button"><span>💬</span><b data-t="asistente"></b></button>
</nav>

<div id="aviso" class="aviso oculto"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="reglas.js"></script>
<script src="app.js"></script>
<script src="gastos.js"></script>
<script src="asistente-local.js"></script>
<script src="asistente.js"></script>
<script src="inicio.js"></script>
</body>
</html>
