<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>Visitas São José</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra">
  <div class="titulo"><b>São José</b><span id="sub">Visitas de campo</span></div>
  <button id="btn-sync" class="pill" type="button">—</button>
</header>

<main>
  <section id="tela-mapa" class="tela">
    <div id="mapa"></div>
    <div id="aqui" class="aqui oculto"></div>
    <div class="leyenda" id="leyenda"></div>
  </section>
  <section id="tela-potreiros" class="tela oculto"></section>
  <section id="tela-ficha" class="tela oculto"></section>
  <section id="tela-visita" class="tela oculto"></section>
  <section id="tela-visitas" class="tela oculto"></section>
  <section id="tela-detalle" class="tela oculto"></section>
  <section id="tela-config" class="tela oculto"></section>
</main>

<nav class="pestanas">
  <button data-tela="mapa" class="activa" type="button"><span>🗺️</span><b data-t="mapa"></b></button>
  <button data-tela="potreiros" type="button"><span>📋</span><b data-t="potreiros"></b></button>
  <button data-tela="nueva" type="button" class="nueva"><span>＋</span><b data-t="nueva"></b></button>
  <button data-tela="visitas" type="button"><span>🕓</span><b data-t="visitas"></b></button>
  <button data-tela="config" type="button"><span>⚙️</span><b data-t="config"></b></button>
</nav>

<div id="aviso" class="aviso oculto"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="reglas.js"></script>
<script src="app.js"></script>
</body>
</html>
